<svg
  width="1200"
  height="800"
  viewBox="0 0 1200 800"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient
      id="bg"
      x1="0"
      y1="0"
      x2="1200"
      y2="800"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#0F172A" />
      <stop offset="1" stop-color="#1E293B" />
    </linearGradient>

    <linearGradient id="boardGlow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F8FAFC" stop-opacity="0.2" />
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0.05" />
    </linearGradient>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow
        dx="0"
        dy="12"
        stdDeviation="18"
        flood-color="#000000"
        flood-opacity="0.35"
      />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg)" />

  <!-- Decorative circles -->
  <circle cx="180" cy="160" r="120" fill="#38BDF8" opacity="0.08" />
  <circle cx="1020" cy="640" r="180" fill="#22C55E" opacity="0.08" />

  <!-- Chess board -->
  <g filter="url(#shadow)">
    <rect x="320" y="150" width="560" height="560" rx="28" fill="#0B1220" />
    <rect
      x="340"
      y="170"
      width="520"
      height="520"
      rx="18"
      fill="url(#boardGlow)"
      stroke="#475569"
      stroke-width="2"
    />

    <!-- Squares -->
    <g>
      <rect x="340" y="170" width="65" height="65" fill="#CBD5E1" />
      <rect x="405" y="170" width="65" height="65" fill="#334155" />
      <rect x="470" y="170" width="65" height="65" fill="#CBD5E1" />
