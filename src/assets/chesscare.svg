    />
    <rect x="55" y="210" width="90" height="18" rx="6" fill="#E2E8F0" />
    <circle cx="100" cy="20" r="16" fill="#38BDF8" />
  </g>

  <!-- Child pawn piece -->
  <g transform="translate(640 370)">
    <circle cx="45" cy="35" r="24" fill="#22C55E" />
    <path
      d="M25 70H65C65 95 80 110 80 145H10C10 110 25 95 25 70Z"
      fill="#DCFCE7"
    />
    <rect x="0" y="145" width="90" height="16" rx="6" fill="#BBF7D0" />
  </g>

  <!-- Protection arc -->
  <path
    d="M560 300C640 220 760 240 820 360"
    stroke="#38BDF8"
    stroke-width="8"
    stroke-linecap="round"
    opacity="0.7"
